name: Build LKM for KernelSU

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMI版本，例如 6.12-android16'
        required: true
        default: '6.12-android16'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi: [ ${{ github.event.inputs.kmi }} ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build LKM
        run: |
          chmod +x scripts/build-lkm.sh
          ./scripts/build-lkm.sh ${{ matrix.kmi }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-${{ matrix.kmi }}
          path: out/**/*.ko
