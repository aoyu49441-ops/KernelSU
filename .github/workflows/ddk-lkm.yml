name: Build KernelSU LKM
on:
  workflow_dispatch:
    inputs:
      kmi:
        description: KMI (例如 6.12-android16)
        required: true
        default: 6.12-android16
      ddk_release:
        description: DDK 版本
        required: true
        default: 20260828

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KernelSU
        uses: actions/checkout@v4

      - name: Download Android DDK
        run: |
          set -e
          DDK_VER=${{ inputs.ddk_release }}
          wget -q https://dl.google.com/android/ddk/${DDK_VER}/ddk-linux-x86_64-${DDK_VER}.zip
          unzip -q ddk-linux-x86_64-${DDK_VER}.zip
          echo "DDK_ROOT=$PWD/ddk-${DDK_VER}" >> $GITHUB_ENV

      - name: Build LKM
        run: |
          make -C kernel KMI=${{ inputs.kmi }} DDK=${{ env.DDK_ROOT }}

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-lkm-${{ inputs.kmi }}
          path: kernel/*.ko
