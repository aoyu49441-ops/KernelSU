name: Build KernelSU Kernel Module

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: KMI version
        required: true
        default: 6.12-android16
      ddk_release:
        description: DDK release version
        required: true
        default: 20260828
      package_name:
        description: package name of kernel
        required: false
      expected_size:
        description: expected signature size
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ylarod/ddk-min:${{ inputs.ddk_release }}
    steps:
      - name: Checkout KernelSU
        uses: actions/checkout@v4

      - name: Build LKM
        run: |
          make -C kernel KMI=${{ inputs.kmi }} PACKAGE_NAME=${{ inputs.package_name }} EXPECTED_SIZE=${{ inputs.expected_size }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-lkm-${{ inputs.kmi }}
          path: kernel/*.ko
