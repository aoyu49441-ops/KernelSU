name: Build KernelSU Kernel Module
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      package_name:
        description: 'package name of kernel'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Android DDK
        uses: kernelsu/action-ddk-build@main
        with:
          kmi: ${{ inputs.kmi }}
          ddk_release: ${{ inputs.ddk_release }}
          package_name: ${{ inputs.package_name }}
          expected_size: ${{ inputs.expected_size }}
